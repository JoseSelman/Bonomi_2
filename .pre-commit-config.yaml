repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        files: \.(c|cc|cpp|h|hpp)$
      - id: cppcheck
        name: cppcheck
        entry: cppcheck --enable=warning,style,performance,portability --std=c++11 --inline-suppr --error-exitcode=1 lib src test
        language: system
        pass_filenames: false
